spring.application.name=demo
# Base de datos H2 guardada en el archivo data/registro (dentro del proyecto)
spring.datasource.url=jdbc:h2:file:./data/registro
spring.datasource.username=sa
spring.datasource.password=
 
# Crea o actualiza las tablas a partir de las clases @Entity
spring.jpa.hibernate.ddl-auto=update
 
# Consola para ver la base de datos en http://localhost:8080/h2-console
spring.h2.console.enabled=true
 
# Quita un aviso (WARN) de la consola al iniciar
spring.jpa.open-in-view=false
